name: CodSpeed

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - doc/**
      - .vscode/**
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - doc/**
      - .vscode/**
  workflow_dispatch:

env:
  CI: true

permissions: {}

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    environment: codespeed

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed
        env:
          ROSEAU_LOAD_FLOW_LICENSE_KEY: ${{ secrets.ROSEAU_LOAD_FLOW_LICENSE_KEY }}
