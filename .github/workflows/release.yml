name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    # Only release tag pushes (not branch pushes or PRs) whose tests succeeded.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(fromJSON('["main", "develop"]'), github.event.workflow_run.head_branch)
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Determine tag and pre-release status
        id: info
        env:
          # The tag name, since workflow_run reports it as the "head_branch" of a tag push.
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Only accept PEP 440 version tags: vX.Y.Z (final) or vX.Y.Z{aN,bN,rcN} (pre-release).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release tag (expected vX.Y.Z[aN|bN|rcN])"
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ -n "${BASH_REMATCH[1]}" ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build wheel and sdist
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The LFS files are needed as some of them are package data (no cache for a release build).
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Build
        run: uv build --out-dir dist

      # The version is taken from pyproject.toml: make sure it matches the tag.
      - name: Check artifacts version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          expected=("roseau_load_flow-$VERSION-py3-none-any.whl" "roseau_load_flow-$VERSION.tar.gz")
          found=$(cd dist && ls | sort)
          if [[ "$found" != "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
            echo "::error::Expected artifacts ${expected[*]} for the version $VERSION, found: $found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish_pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist

  github_release:
    name: Publish GitHub release
    needs: [resolve, publish_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: tell gh which repository to use.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          args=(--title "Version $VERSION" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest=true)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
