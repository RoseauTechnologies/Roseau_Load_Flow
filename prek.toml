# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = "^.idea/|.vscode/"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.23"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.2"
hooks = [
  { id = "check-github-workflows" },
  { id = "check-github-actions" },
  { id = "check-dependabot" },
  { id = "check-readthedocs" }
]

[[repos]]
repo = "https://github.com/adhtruong/mirrors-typos"
rev = "v1.51.1"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.1"
hooks = [{ id = "zizmor" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.10"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter"] },
  { id = "ruff-format", types_or = ["markdown"], args = ["--line-length", "90"] }
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.78"
hooks = [{ id = "rumdl" }]

[[repos]]
repo = "https://github.com/owenlamont/ryl-pre-commit"
rev = "v0.24.0"
hooks = [
  { id = "ryl", args = ["--fix", "--strict"] },
  { id = "ryl-markdown", args = ["--fix", "--strict"] }
]

[[repos]]
repo = "https://github.com/jolars/badness-pre-commit"
rev = "v0.26.0"
hooks = [{ id = "badness-lint", args = ["--fix"] }, { id = "badness-format" }]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.15"
hooks = [{ id = "biome-check", types_or = ["json", "html", "css"], files = ".*" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.7.3"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/oxipng/oxipng"
rev = "v10.2.1"
hooks = [{ id = "oxipng", args = ["-o", "4", "--strip", "safe", "--alpha"] }]

[[repos]]
repo = "local"
hooks = [
  {
    id = "svgo",
    name = "svgo",
    entry = "svgo --multipass --final-newline",
    language = "node",
    additional_dependencies = ["svgo@4.1.0"],
    types = ["svg"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "minify-html",
    name = "Minify HTML files",
    types_or = ["html"],
    entry = "python scripts/minhtml.py",
    language = "python",
    args = ["--overwrite", "--keep-closing-tags", "--minify-css", "--minify-js", "--minify-doctype"],
    additional_dependencies = ["minify-html"]
  }
]
