rules:
  cache-poisoning:
    ignore:
      # ignore ci.yml and pre-commit.yml as there is no release in these workflows
      - ci.yml
      - pre-commit.yml
  dangerous-triggers:
    ignore:
      # workflow_run is gated on event == 'push' of a tag: the checked out code (head_sha) can only
      # come from this repository, a workflow_run from a fork PR can never satisfy the release jobs.
      - release.yml
